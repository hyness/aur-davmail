name: Build and install test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: makepkg build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git unzip sudo

      - uses: actions/checkout@v4

      - name: Build package as non-root user
        run: |
          useradd -m builder
          chown -R builder:builder .
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          su builder -c 'makepkg -s --noconfirm --skippgpcheck'

      - name: Verify a package artifact was produced
        run: ls -la *.pkg.tar.*

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: '*.pkg.tar.*'
          retention-days: 1

  install:
    name: Install on a clean system
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg

      - name: Update system and install the built package
        run: |
          # Mirror flakes ("failed retrieving file ... Connection timed out")
          # are transient, so retry the sync/upgrade a few times.
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm && break
            if [ "$attempt" = 3 ]; then
              echo "pacman -Syu failed 3 times" >&2
              exit 1
            fi
            sleep 10
          done
          # No --nodeps: this is the point of the job. pacman must resolve
          # every declared `depends` entry against a clean system with
          # nothing pre-installed beyond `base`.
          #
          # pacman -U itself returns 0 even when a post-install scriptlet
          # (.install) fails, so also fail this step if pacman logged
          # "error: command failed to execute correctly" - that's how a broken
          # .install script shows up. A bare "error:" match is wrong: it also
          # catches transient mirror noise ("failed retrieving file") that
          # pacman recovers from. pipefail (bash -e) covers pacman itself
          # failing through the tee pipe.
          # An array, not a single $(ls ...) string: makepkg can produce more
          # than one artifact (e.g. a compiled build also gets an automatic
          # -debug package), and passing them as one unquoted/unsplit string
          # to pacman -U garbles the filename instead of installing both.
          PKGS=(*.pkg.tar.*)
          pacman -U --noconfirm "${PKGS[@]}" 2>&1 | tee /tmp/pacman.log
          ! grep -q 'error: command failed to execute correctly' /tmp/pacman.log

      - name: Verify installed files are present
        run: |
          test -f /usr/bin/davmail
          test -f /usr/share/davmail/davmail.jar
          test -f /usr/share/applications/davmail.desktop
          test -f /usr/lib/systemd/system/davmail@.service
          test -f /usr/lib/systemd/user/davmail@.service

      - name: Smoke test - davmail starts and serves IMAP
        run: |
          cat > /tmp/smoke.properties <<'EOF'
          davmail.server=true
          davmail.url=https://outlook.office365.com/EWS/Exchange.asmx
          davmail.mode=O365Manual
          davmail.imapPort=1143
          davmail.enableKeepAlive=false
          davmail.logFilePath=/tmp/davmail.log
          EOF
          export JAVA_OPTS="-Djava.awt.headless=true"
          /usr/bin/davmail /tmp/smoke.properties >/tmp/davmail.out 2>&1 &
          DAVMAIL_PID=$!
          GREETING=""
          for _ in $(seq 1 30); do
            if GREETING=$( { exec 3<>/dev/tcp/127.0.0.1/1143 && IFS= read -r -t 5 line <&3 && printf '%s' "$line"; } 2>/dev/null ); then
              [ -n "$GREETING" ] && break
            fi
            GREETING=""
            sleep 1
          done
          echo "IMAP greeting: $GREETING"
          if [[ "$GREETING" != '* OK'* ]]; then
            echo "No IMAP greeting from davmail within 30s" >&2
            echo "--- /tmp/davmail.out ---"; cat /tmp/davmail.out || true
            echo "--- /tmp/davmail.log ---"; cat /tmp/davmail.log || true
            kill "$DAVMAIL_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$DAVMAIL_PID" 2>/dev/null || true
